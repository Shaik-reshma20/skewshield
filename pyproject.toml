[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skewshield"
version = "1.0.0"
description = "A reproducible PySpark data-quality and skew-optimization benchmark"
requires-python = ">=3.10,<3.13"
dependencies = ["pyspark==3.5.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["skewshield*"]
